<!DOCTYPE html><html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080D18">
  <meta name="description" content="VEXON VPN — رابط مدیریت اتصال و سرورها">
  <title>VEXON VPN</title>  <style>
    :root {
      --bg: #080D18;
      --panel: #111A2A;
      --panel2: #162238;
      --blue: #20C8F5;
      --blue2: #477BFF;
      --text: #F4F7FF;
      --muted: #8E9BB2;
      --green: #28D99A;
      --border: rgba(255,255,255,.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      min-height: 100dvh;
      padding:
        env(safe-area-inset-top)
        16px
        env(safe-area-inset-bottom);
    }

    button, input {
      font: inherit;
    }

    button {
      color: inherit;
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 460px;
      height: 100%;
      min-height: 0;
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 72px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .logo {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(145deg, var(--blue), var(--blue2));
      color: #06101C;
      font-weight: 900;
      font-size: 20px;
      box-shadow: 0 0 25px #20c8f52b;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1.5px;
    }

    .brand-sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
    }

    .version {
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--muted);
      font-size: 10px;
    }

    .connection-card {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 28px;
      background:
        radial-gradient(ellipse at 50% 35%, #18385a55, transparent 60%),
        var(--panel);
      padding: 16px;
      position: relative;
      overflow: hidden;
    }

    .connection-card::before {
      content: "";
      position: absolute;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      border: 1px solid #20c8f510;
      pointer-events: none;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 13px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: #080d1888;
      color: var(--muted);
      font-size: 11px;
      z-index: 1;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #77849A;
    }

    .status-pill.connected {
      color: var(--green);
    }

    .status-pill.connected .status-dot {
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
    }

    .connect-area {
      width: min(65vw, 245px);
      max-width: 245px;
      aspect-ratio: 1;
      position: relative;
      display: grid;
      place-items: center;
      margin: 18px 0;
      z-index: 1;
    }

    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid #20c8f52b;
      transition: .3s;
    }

    .ring.r2 {
      inset: 14px;
      border-color: #477bff35;
    }

    .ring.r3 {
      inset: 29px;
      border-style: dashed;
      border-color: #20c8f53b;
    }

    .connect-area.busy .ring.r1 {
      animation: pulse 1.5s infinite;
    }

    .connect-area.busy .ring.r2 {
      animation: pulse 1.5s .3s infinite;
    }

    .connect-area.busy .ring.r3 {
      animation: rotate 8s linear infinite;
    }

    .connect-button {
      width: 58%;
      aspect-ratio: 1;
      border: 1px solid #54dcff8a;
      border-radius: 50%;
      background: linear-gradient(145deg, #1b4362, #10233f 75%);
      box-shadow:
        inset 0 0 25px #20c8f520,
        0 0 35px #20c8f51a;
      display: grid;
      place-items: center;
      transition: transform .2s, box-shadow .2s;
    }

    .connect-button:active {
      transform: scale(.95);
    }

    .power-icon {
      width: 44px;
      height: 44px;
      fill: none;
      stroke: var(--blue);
      stroke-width: 2.6;
      stroke-linecap: round;
    }

    .connect-title {
      font-size: 19px;
      font-weight: bold;
      z-index: 1;
    }

    .connect-desc {
      margin-top: 9px;
      max-width: 290px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      line-height: 1.9;
      z-index: 1;
    }

    .jump {
      animation: jump .45s ease;
    }

    .server-card {
      flex-shrink: 0;
      margin-top: 12px;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--panel);
    }

    .server-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .server-heading strong {
      font-size: 13px;
    }

    .server-heading span {
      color: var(--muted);
      font-size: 10px;
    }

    .server-select {
      width: 100%;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 11px;
      text-align: right;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel2);
    }

    .server-icon {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #20c8f514;
      font-size: 20px;
    }

    .server-info {
      flex: 1;
      min-width: 0;
    }

    .server-name {
      font-size: 12px;
      font-weight: bold;
    }

    .server-detail {
      margin-top: 6px;
      color: var(--muted);
      font-size: 10px;
    }

    .server-arrow {
      color: var(--muted);
      font-size: 18px;
    }

    .tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
      flex-shrink: 0;
    }

    .tool-button {
      min-height: 43px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: #111A2A;
      font-size: 11px;
    }

    .tool-button:active {
      background: #1a2b43;
    }

    .bottom-nav {
      height: 64px;
      flex-shrink: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      margin-top: 8px;
    }

    .nav-button {
      height: 48px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
    }

    .nav-button b {
      font-size: 18px;
      font-weight: normal;
    }

    .nav-button.active {
      color: var(--blue);
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: #0009;
      padding: 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }

    .overlay.open {
      display: flex;
    }

    .sheet {
      width: 100%;
      max-width: 460px;
      max-height: 75dvh;
      overflow-y: auto;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: #101a2b;
    }

    .sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .sheet-head h2 {
      margin: 0;
      font-size: 16px;
    }

    .close-button {
      width: 35px;
      height: 35px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #1b2940;
    }

    .server-option {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 9px;
      padding: 14px;
      text-align: right;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #152239;
    }

    .server-option:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .server-option small {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 10px;
    }

    .sheet-note {
      color: var(--muted);
      font-size: 11px;
      line-height: 2;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: .7; }
      50% { transform: scale(1.07); opacity: 1; }
    }

    @keyframes rotate {
      to { transform: rotate(360deg); }
    }

    @keyframes jump {
      0%, 100% { transform: translateY(0); }
      45% { transform: translateY(-8px); }
    }

    @media (max-height: 700px) {
      header { height: 58px; }
      .logo { width: 36px; height: 36px; }
      .connect-area { width: min(43vh, 190px); margin: 10px 0; }
      .connection-card { padding: 10px; }
      .connect-desc { margin-top: 6px; font-size: 10px; }
      .server-card { padding: 10px; margin-top: 8px; }
      .server-icon { width: 34px; height: 34px; }
      .tools { margin-top: 7px; }
      .bottom-nav { height: 52px; }
    }

    @media (max-height: 570px) {
      .connect-area { width: 125px; margin: 6px 0; }
      .connect-desc { display: none; }
      .server-card { padding: 8px; }
      .server-heading { margin-bottom: 6px; }
      .server-select { padding: 7px; }
      .tool-button { min-height: 35px; }
      .bottom-nav { height: 42px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style></head><body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="logo">V</div>
        <div>
          <div class="brand-name">VEXON</div>
          <div class="brand-sub">PRIVATE CONNECTION</div>
        </div>
      </div>
      <div class="version" id="version">نسخه 0.1.0</div>
    </header><section class="connection-card">
  <div class="status-pill" id="status-pill">
    <span class="status-dot"></span>
    <span id="connection-status">متصل نیست</span>
  </div>

  <div class="connect-area" id="connect-area">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>

    <button
      class="connect-button"
      id="connect-btn"
      type="button"
      aria-label="شروع اتصال"
    >
      <svg class="power-icon" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 5v20"></path>
        <path d="M13 12a18 18 0 1 0 22 0"></path>
      </svg>
    </button>
  </div>

  <div class="connect-title" id="connect-title">اتصال امن</div>
  <div class="connect-desc" id="connect-desc">
    سرور را انتخاب کن. اتصال واقعی پس از راه‌اندازی زیرساخت فعال می‌شود.
  </div>
</section>

<section class="server-card">
  <div class="server-heading">
    <strong>سرور انتخابی</strong>
    <span id="server-count">۰ سرور آماده</span>
  </div>

  <button class="server-select" id="choose-server-btn" type="button">
    <div class="server-icon">◈</div>
    <div class="server-info">
      <div class="server-name" id="selected-server-name">سروری انتخاب نشده</div>
      <div class="server-detail" id="selected-server-detail">
        ابتدا سرور را پیکربندی کنید
      </div>
    </div>
    <div class="server-arrow">‹</div>
  </button>
</section>

<section class="tools">
  <button class="tool-button" id="import-config-btn" type="button">
    ＋ واردکردن کانفیگ
  </button>
  <button class="tool-button" id="activate-subscription-btn" type="button">
    ◈ فعال‌سازی اشتراک
  </button>
</section>

<nav class="bottom-nav" aria-label="منوی اصلی">
  <button class="nav-button active" id="nav-home" type="button">
    <b>⌂</b>
    خانه
  </button>
  <button class="nav-button" id="nav-servers" type="button">
    <b>◈</b>
    سرورها
  </button>
  <button class="nav-button" id="nav-settings" type="button">
    <b>⚙</b>
    تنظیمات
  </button>
</nav>

  </main>  <div class="overlay" id="server-overlay" aria-hidden="true">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <h2 id="sheet-title">انتخاب سرور</h2>
        <button class="close-button" id="close-server-sheet" type="button" aria-label="بستن">×</button>
      </div>
      <div id="server-options"></div>
      <p class="sheet-note">
        سرورهایی که هنوز آدرس و تنظیمات معتبر ندارند، قابل انتخاب نیستند.
        این نسخه هنوز اتصال VPN برقرار نمی‌کند.
      </p>
    </section>
  </div>  <script src="./config.js"></script>  <script src="./servers.js"></script>  <script src="./app.js"></script>  <script>
    (() => {
      const $ = id => document.getElementById(id);
      let selectedServer = null;

      function showToast(message) {
        if (window.VEXON_APP) {
          window.VEXON_APP.notify(message);
          return;
        }

        alert(message);
      }

      function readServers() {
        if (window.VEXON_SERVERS &&
            typeof window.VEXON_SERVERS.getServers === "function") {
          return window.VEXON_SERVERS.getServers();
        }

        if (typeof window.getServers === "function") {
          return window.getServers();
        }

        return [];
      }

      function getServerId(server) {
        return server.id || server.serverId || "";
      }

      function getServerName(server) {
        return server.name || server.label || getServerId(server);
      }

      function isServerReady(server) {
        return server.enabled === true &&
          Boolean(server.address || server.host) &&
          server.status !== "unconfigured";
      }

      function refreshServerList() {
        const servers = readServers();
        const readyServers = servers.filter(isServerReady);

        $("server-count").textContent =
          readyServers.length.toLocaleString("fa-IR") + " سرور آماده";

        const list = $("server-options");
        list.replaceChildren();

        if (servers.length === 0) {
          const message = document.createElement("p");
          message.className = "sheet-note";
          message.textContent = "فهرست سرورها بارگذاری نشد.";
          list.appendChild(message);
          return;
        }

        servers.forEach(server => {
          const ready = isServerReady(server);
          const button = document.createElement("button");
          button.type = "button";
          button.className = "server-option";
          button.disabled = !ready;

          const info = document.createElement("span");
          const title = document.createElement("strong");
          const detail = document.createElement("small");

          title.textContent = getServerName(server);
          detail.textContent = ready
            ? "آماده پیکربندی اتصال"
            : "هنوز پیکربندی نشده";

          info.append(title, detail);

          const status = document.createElement("span");
          status.textContent = ready ? "آماده" : "غیرفعال";
          status.style.color = ready ? "#28D99A" : "#8E9BB2";

          button.append(info, status);

          button.addEventListener("click", () => {
            selectedServer = server;

            $("selected-server-name").textContent = getServerName(server);
            $("selected-server-detail").textContent =
              server.protocol
                ? "پروتکل: " + server.protocol
                : "سرور انتخاب شد";

            if (window.VEXON_APP) {
              window.VEXON_APP.selectServer(
                getServerId(server),
                getServerName(server)
              );
            }

            closeServerSheet();
          });

          list.appendChild(button);
        });
      }

      function openServerSheet() {
        refreshServerList();
        $("server-overlay").classList.add("open");
        $("server-overlay").setAttribute("aria-hidden", "false");
      }

      function closeServerSheet() {
        $("server-overlay").classList.remove("open");
        $("server-overlay").setAttribute("aria-hidden", "true");
      }

      $("connect-btn").addEventListener("click", () => {
        $("connect-area").classList.remove("jump");
        void $("connect-area").offsetWidth;
        $("connect-area").classList.add("jump");

        if (!selectedServer) {
          showToast("ابتدا یک سرور پیکربندی‌شده انتخاب کن.");
          openServerSheet();
          return;
        }

        showToast(
          "سرور انتخاب شده، اما اتصال واقعی VPN هنوز پیاده‌سازی نشده است."
        );
      });

      $("choose-server-btn").addEventListener("click", openServerSheet);
      $("nav-servers").addEventListener("click", openServerSheet);
      $("close-server-sheet").addEventListener("click", closeServerSheet);

      $("server-overlay").addEventListener("click", event => {
        if (event.target === $("server-overlay")) closeServerSheet();
      });

      $("nav-home").addEventListener("click", () => {
        document.querySelectorAll(".nav-button")
          .forEach(button => button.classList.remove("active"));
        $("nav-home").classList.add("active");
      });

      $("nav-servers").addEventListener("click", () => {
        document.querySelectorAll(".nav-button")
          .forEach(button => button.classList.remove("active"));
        $("nav-servers").classList.add("active");
      });

      $("nav-settings").addEventListener("click", () => {
        document.querySelectorAll(".nav-button")
          .forEach(button => button.classList.remove("active"));
        $("nav-settings").classList.add("active");
        showToast("تنظیمات پیشرفته هنوز به بخش اصلی متصل نشده است.");
      });

      const config = window.VEXON_CONFIG;
      if (config && config.app) {
        $("version").textContent = "نسخه " + config.app.version;
        document.title = config.app.name;
      }

      refreshServerList();
    })();
  </script></body>
  </html>
